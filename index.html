  <script>
    function loadScriptSequential(urls, onReady) {
      function next(idx) {
        if (idx >= urls.length) {
          onReady();
          return;
        }
        var pair = urls[idx];
        var s = document.createElement("script");
        s.src = pair[0];
        s.onload = function () { next(idx + 1); };
        s.onerror = function () {
          if (pair[1]) {
            var s2 = document.createElement("script");
            s2.src = pair[1];
            s2.onload = function () { next(idx + 1); };
            s2.onerror = function () { next(idx + 1); };
            document.head.appendChild(s2);
          } else {
            next(idx + 1);
          }
        };
        document.head.appendChild(s);
      }
      next(0);
    }

    loadScriptSequential([
      ["https://unpkg.com/react@18/umd/react.production.min.js", "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"],

      function fisherYatesShuffle(arr) {
        const copy = arr.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const temp = copy[i];
          copy[i] = copy[j];
          copy[j] = temp;

        { topic: "Trích dẫn & Thư mục", q: "Sau khi chèn trích dẫn '(Nguyễn, 2026)', đề bài yêu cầu bổ sung số trang trích dẫn 'tr. 45' và ẩn tên tác giả đi vì đã nhắc tên tác giả trong câu văn. Bạn thực hiện thế nào?", opts: ["Nhấp vào trích dẫn > mũi tên thả xuống > Edit Citation > nhập Pages: 45 và tích chọn Author", "Gõ trực tiếp chữ 'tr. 45' vào bên trong khung trích dẫn", "References > Manage Sources > Edit > thêm số trang", "Chuyển trích dẫn sang văn bản tĩnh (Convert citation to static text)"], ans: 0, exp: "Edit Citation cho phép nhập số trang (Pages) và tích chọn Suppress (ẩn) Author, Year hoặc Title." },
        { topic: "Nền trang (Page Background)", q: "Khi chèn Watermark tùy chỉnh (Custom Watermark) bằng văn bản, tùy chọn 'Semitransparent' có tác dụng gì?", opts: ["Làm mờ chữ Watermark đi 50% để không che khuất nội dung chữ chính bên trên", "Xoay chữ Watermark nghiêng một góc 45 độ", "Chỉ hiển thị Watermark ở trang đầu tiên", "Biến chữ Watermark thành hình ảnh vector"], ans: 0, exp: "Semitransparent tạo độ trong suốt mờ cho Watermark nhằm đảm bảo văn bản chính vẫn dễ đọc." },
        { topic: "Thuộc tính tài liệu", q: "Để chèn trường thông tin 'Author' (Tên tác giả từ File > Info) vào vị trí con trỏ trong văn bản sao cho khi đổi tên tác giả ở Info thì văn bản cũng tự cập nhật, bạn chọn lệnh nào?", opts: ["Insert > Quick Parts > Document Property > Author", "Insert > Text Box > Author Info", "References > Insert Citation > Author", "Design > Document Formatting > Author"], ans: 0, exp: "Insert > Quick Parts > Document Property chèn các trường siêu dữ liệu động liên kết hai chiều với File > Info." },
        { topic: "Bảng biểu (Tables)", q: "Để chia một ô đang chọn trong bảng thành 2 cột và 3 hàng (tổng 6 ô nhỏ) mà không ảnh hưởng đến các hàng khác, bạn chọn lệnh nào?", opts: ["Layout (Table Tools) > nhóm Merge > Split Cells > nhập Number of columns: 2, Number of rows: 3", "Layout (Table Tools) > nhóm Merge > Split Table", "Table Design > Draw Table", "Layout (Table Tools) > Distribute Rows & Columns"], ans: 0, exp: "Split Cells chia tách các ô đang chọn theo số cột và số hàng chỉ định." },
        { topic: "Hình ảnh & Đồ họa", q: "Sau khi cắt xén (Crop) một bức ảnh, bạn nhận thấy chủ thể bên trong bị lệch sang trái khung cắt. Làm thế nào để dịch chuyển phần ảnh bên trong mà giữ nguyên vị trí khung cắt trên trang?", opts: ["Nhấn nút Crop, sau đó kéo phần hình ảnh màu mờ bên trong khung cắt (không kéo các thanh đen ở viền)", "Dùng công cụ Position trên thẻ Picture Format", "Nhấn Reset Picture & Size", "Đổi chế độ Wrap Text sang Behind Text"], ans: 0, exp: "Khi công cụ Crop đang kích hoạt, kéo bên trong ảnh sẽ di chuyển vùng ảnh hiển thị bên dưới khung cắt cố định." },
        { topic: "Chữ nghệ thuật", q: "Để xóa bỏ toàn bộ hiệu ứng đổ bóng, phát sáng (Glow) và phản chiếu (Reflection) của một đối tượng WordArt nhưng vẫn giữ nguyên nội dung chữ và phông chữ, bạn nhấn nút nào?", opts: ["Shape Format > WordArt Styles > Clear WordArt", "Home > Clear All Formatting", "Shape Format > Text Effects > No Shadow", "Picture Format > Reset Picture"], ans: 0, exp: "Trong thư viện Quick Styles của WordArt Styles có tùy chọn Clear WordArt ở dưới cùng." },
        { topic: "Bảng biểu (Tables)", q: "Trong bảng Word gồm 4 cột (Sản phẩm, Số lượng, Đơn giá, Thành tiền), tại ô D2 bạn muốn tính tích của Số lượng (B2) và Đơn giá (C2) với định dạng tiền tệ '#,##0'. Công thức đúng trong hộp thoại Formula là gì?", opts: ["=B2*C2 (Number format: #,##0)", "=PRODUCT(LEFT) (Number format: #,##0)", "=MULTIPLY(B2, C2)", "Cả A và B đều cho kết quả chính xác trong Word Table"], ans: 3, exp: "Word Table hỗ trợ cả tham chiếu tọa độ ô kiểu Excel (=B2*C2) lẫn từ khóa hướng (=PRODUCT(LEFT))." },
        { topic: "Kiểm tra tài liệu", q: "Khi công cụ Accessibility Checker báo lỗi 'Missing Alternative Text' cho một biểu đồ hoặc hình ảnh trang trí thuần túy (không mang thông tin nội dung), cách xử lý chuẩn xác nhất theo MOS là gì?", opts: ["Mở ngăn Alt Text và tích chọn ô 'Mark as decorative'", "Xóa bỏ hình ảnh đó khỏi tài liệu", "Nhập dấu cách vào ô mô tả Alt Text", "Chuyển hình ảnh sang định dạng JPEG"], ans: 0, exp: "Đánh dấu 'Mark as decorative' báo cho trình đọc màn hình (Screen Reader) bỏ qua các hình ảnh chỉ mang tính trang trí." },
        { topic: "Tab dừng (Tabs)", q: "Ký hiệu chữ 'T' ngược (⊥) trên thanh thước ngang (Ruler) biểu thị loại điểm dừng Tab nào?", opts: ["Left Tab", "Center Tab", "Right Tab", "Decimal Tab"], ans: 1, exp: "Chữ L là Left Tab; chữ T ngược (⊥) là Center Tab; chữ L ngược là Right Tab; chữ T ngược có dấu chấm là Decimal Tab." },
        { topic: "Lưu trữ & Xuất bản", q: "Khi xuất tài liệu Word sang PDF qua File > Export > Create PDF/XPS, nếu muốn các tiêu đề Heading 1, Heading 2 tự động trở thành thanh điều hướng Bookmark trong trình đọc PDF, bạn nhấn nút 'Options...' và tích chọn mục nào?", opts: ["Create bookmarks using: Headings", "Document properties", "PDF/A compliant", "Optimize for: Minimum size"], ans: 0, exp: "Trong hộp thoại Options của xuất PDF, tích chọn 'Create bookmarks using: Headings' giúp tạo cây mục lục điều hướng trong file PDF." },
        { topic: "Định dạng đoạn văn", q: "Định dạng thụt lề 'Hanging Indent' (thụt lề treo — dòng đầu sát lề trái, các dòng sau thụt vào trong) thường được dùng chuẩn mực nhất cho thành phần nào?", opts: ["Danh mục tài liệu tham khảo (Bibliography / Works Cited)", "Tiêu đề chính của báo cáo", "Chữ ký cuối thư", "Nội dung bên trong ô của bảng"], ans: 0, exp: "Hanging Indent là quy chuẩn trình bày của trích dẫn tài liệu tham khảo theo chuẩn APA, MLA, IEEE." },
        { topic: "Danh sách (Lists)", q: "Để liên kết từng cấp độ (Level 1, Level 2, Level 3) của một danh sách đa cấp với các Style tương ứng (Heading 1, Heading 2, Heading 3) nhằm đánh số chương mục tự động toàn bài, bạn dùng hộp thoại nào?", opts: ["Home > Multilevel List > Define New Multilevel List > nhấn More >> > mục Link level to style", "Manage Styles > Set Defaults", "References > Table of Contents > Custom", "Home > Styles > Modify Style > Numbering"], ans: 0, exp: "Define New Multilevel List > More >> > Link level to style là kỹ thuật chuẩn để đánh số tự động cho hệ thống Heading." },
        { topic: "Bảng biểu (Tables)", q: "Khi sắp xếp một cột chứa dữ liệu dạng ngày tháng (ví dụ: 25/12/2026, 05/01/2026) trong bảng Word, bạn phải chọn giá trị nào ở mục 'Type' trong hộp thoại Sort để sắp xếp đúng thứ tự thời gian?", opts: ["Text", "Number", "Date", "Chronological"], ans: 2, exp: "Chọn Type: Date giúp Word hiểu đúng giá trị ngày tháng thay vì sắp xếp theo thứ tự bảng chữ cái (Text)." },
        { topic: "Chèn đối tượng", q: "Để liên kết hai hộp văn bản (Text Box) rỗng với nhau sao cho khi văn bản gõ đầy hộp thứ nhất sẽ tự động tràn sang hộp thứ hai giống như cột báo, bạn chọn hộp thứ nhất và nhấn nút nào?", opts: ["Shape Format > nhóm Text > Create Link", "Insert > Links > Cross-reference", "Layout > Arrange > Group", "Shape Format > Wrap Text > Through"], ans: 0, exp: "Tính năng Create Link kết nối luồng văn bản liên tục giữa các Text Box." },
        { topic: "Quản lý trang", q: "Khi tài liệu sử dụng thiết lập lề 'Mirrored' hoặc bật 'Different Odd & Even Pages', tên gọi của lề trái trên trang lẻ và lề phải trên trang chẵn (phần gáy đóng sách) là gì?", opts: ["Inside margin", "Outside margin", "Gutter margin", "Binding margin"], ans: 0, exp: "Khi bật Mirrored margins, Left và Right đổi tên thành Inside (lề trong giáp gáy) và Outside (lề ngoài)." },
        { topic: "Tham chiếu (References)", q: "Nếu bạn chèn thêm một hình ảnh mới vào trang 2 và gắn Caption cho nó, các số thứ tự Caption của các hình ở trang 3, 4 không tự động nhảy số ngay lập tức. Làm thế nào để cập nhật toàn bộ số thứ tự Caption trong tài liệu?", opts: ["Nhấn Ctrl + A để chọn toàn bộ văn bản, sau đó nhấn phím F9", "Vào References > Update Table", "Lưu tệp và đóng Word rồi mở lại", "Nhấn phím F5"], ans: 0, exp: "Số thứ tự Caption là trường SEQ Field; bôi đen toàn bài (Ctrl + A) và nhấn F9 sẽ cập nhật tất cả các trường." },
        { topic: "Hiệu chỉnh văn bản", q: "Sự khác biệt giữa phím tắt Ctrl + Spacebar và Ctrl + Shift + N khi định dạng văn bản là gì?", opts: ["Ctrl + Spacebar chỉ xóa định dạng ký tự trực tiếp; Ctrl + Shift + N đưa đoạn văn về Style 'Normal'", "Ctrl + Spacebar xóa cả văn bản; Ctrl + Shift + N tạo tài liệu mới", "Hai phím tắt này có chức năng giống hệt nhau", "Ctrl + Spacebar căn đều hai bên; Ctrl + Shift + N đánh số thứ tự"], ans: 0, exp: "Ctrl + Spacebar = Clear Character Formatting; Ctrl + Shift + N = Apply Normal Style." },
        { topic: "Hình ảnh & Đồ họa", q: "Khi sử dụng công cụ 'Remove Background' trên thẻ Picture Format, vùng màu tím (Magenta) phủ lên bức ảnh có ý nghĩa gì?", opts: ["Vùng sẽ bị xóa bỏ (trở thành trong suốt) sau khi nhấn Keep Changes", "Vùng sẽ được giữ lại nguyên vẹn", "Vùng đang bị lỗi độ phân giải thấp", "Vùng sẽ được chuyển thành màu đen trắng"], ans: 0, exp: "Màu tím biểu thị vùng bị loại bỏ; dùng Mark Areas to Keep (+) để giữ lại chi tiết bị tô tím nhầm." },
        { topic: "Quản lý tài liệu", q: "Để lưu các thay đổi về phông chữ mặc định (ví dụ: Times New Roman, 13 pt) cho mọi tài liệu mới tạo ra sau này từ mẫu Normal.dotm, bạn nhấn nút nào trong hộp thoại Font?", opts: ["Set As Default > chọn 'All documents based on the Normal.dotm template'", "OK > Save Theme", "Manage Styles > Import/Export", "File > Options > Save as Default"], ans: 0, exp: "Set As Default > chọn tùy chọn thứ hai ('All documents based on the Normal template') sẽ lưu vĩnh viễn vào Normal.dotm." },
        { topic: "Chèn đối tượng", q: "Phím tắt mặc định của Word để chèn nhanh ký hiệu Bản quyền © (Copyright) khi đang gõ văn bản là gì?", opts: ["Gõ (c) rồi nhấn dấu cách hoặc nhấn Alt + Ctrl + C", "Nhấn Ctrl + Shift + C", "Gõ [c] rồi nhấn Enter", "Nhấn Alt + C"], ans: 0, exp: "AutoCorrect tự động chuyển (c) thành ©, (r) thành ®, (tm) thành ™." },
        { topic: "Bảo mật tài liệu", q: "Trong ngăn 'Restrict Editing', sau khi chọn 'Allow only this type of editing in the document: No changes (Read only)', bạn bôi đen một đoạn văn bản và tích chọn 'Everyone' ở mục Exceptions. Điều này có tác dụng gì?", opts: ["Khóa toàn bộ tài liệu không cho sửa, NGOẠI TRỪ đoạn văn bản được bôi đen đó mọi người đều có thể chỉnh sửa", "Chỉ cho phép mọi người đọc đoạn văn đó còn các phần khác bị ẩn", "Xóa quyền chỉnh sửa của tất cả mọi người đối với đoạn văn đó", "Yêu cầu nhập mật khẩu riêng khi nhấp vào đoạn văn đó"], ans: 0, exp: "Tính năng Exceptions trong Restrict Editing cho phép mở khóa cục bộ những vùng được chỉ định trên nền tài liệu bị khóa." },
        { topic: "Định dạng văn bản", q: "Tổ hợp phím tắt nào chuyển đổi nhanh qua lại giữa chữ thường, chữ hoa đầu câu và CHỮ IN HOA TOÀN BỘ cho văn bản đang chọn?", opts: ["Shift + F3", "Ctrl + Shift + A", "Alt + F3", "Ctrl + F3"], ans: 0, exp: "Shift + F3 xoay vòng giữa lowercase, Sentence case và UPPERCASE." },
        { topic: "Bảng biểu (Tables)", q: "Khi con trỏ đang nằm ở ô cuối cùng bên phải của hàng cuối cùng trong một bảng Word, nhấn phím gì sẽ tự động tạo thêm một hàng mới ở đáy bảng?", opts: ["Tab", "Enter", "Shift + Tab", "Ctrl + Enter"], ans: 0, exp: "Nhấn Tab tại ô cuối cùng của bảng sẽ tự động chèn thêm một hàng mới có cùng định dạng." },
        { topic: "Tự động hóa", q: "Để chèn nhanh một đoạn văn bản mẫu ngẫu nhiên gồm 5 đoạn, mỗi đoạn 4 câu nhằm thử nghiệm bố cục trang trong Word, bạn gõ cú pháp nào đầu dòng rồi nhấn Enter?", opts: ["=rand(5,4)", "=lorem(4,5)", "=text(5,4)", "=sample(5,4)"], ans: 0, exp: "=rand(p,s) tạo p đoạn văn với s câu mỗi đoạn; =lorem(p,s) tạo văn bản giả Lorem Ipsum." },
        { topic: "Bình luận (Comments)", q: "Khi in tài liệu hoặc xuất sang PDF, nếu bạn KHÔNG muốn hiển thị các khung bình luận (Comments) ở lề phải trang giấy, bạn tắt tùy chọn nào?", opts: ["File > Print > mục Settings > nhấp Print All Pages > bỏ tích 'Print Markup'", "Review > Delete All Comments in Document", "View > bỏ tích Reviewing Pane", "Design > Page Setup > Hide Comments"], ans: 0, exp: "Bỏ tích 'Print Markup' trong thiết lập in giúp in văn bản sạch mà không cần xóa bình luận." },
        { topic: "Định dạng trang", q: "Khi tạo đường viền trang (Page Border), làm thế nào để đường viền ôm sát vào khung văn bản (Text) thay vì nằm sát mép ngoài cùng của trang giấy (Edge of page)?", opts: ["Hộp thoại Borders and Shading > thẻ Page Border > nhấn nút Options... > đổi Measure from thành 'Text'", "Đổi Style đường viền sang kiểu 3-D", "Chọn Apply to: This section - First page only", "Giảm độ rộng Width xuống 1/2 pt"], ans: 0, exp: "Nút Options... trong thẻ Page Border cho phép đo khoảng cách từ mép giấy (Edge of page) hoặc từ lề văn bản (Text)." },
        { topic: "Tham chiếu (References)", q: "Trong tài liệu có cả 'Hình' (Figure) và 'Bảng' (Table) đều được gắn Caption. Khi chèn Danh mục bảng biểu (Insert Table of Figures), bạn chọn thông số nào để chỉ liệt kê các Bảng mà không lẫn Hình?", opts: ["Caption label: Bảng (hoặc Table)", "Include label and number", "Formats: From template", "Modify... > Style: Table Caption"], ans: 0, exp: "Mục Caption label lọc chính xác nhãn đối tượng (Hình, Bảng, Equation) cần tổng hợp danh mục." },
        { topic: "Bố cục & Hiển thị", q: "Trong ngăn điều hướng Navigation Pane (Ctrl + F), thẻ nào cho phép bạn kéo thả để thay đổi vị trí cả một chương lớn (gồm tiêu đề Heading và toàn bộ nội dung bên dưới nó)?", opts: ["Headings", "Pages", "Results", "Outline"], ans: 0, exp: "Thẻ Headings trong Navigation Pane hiển thị cấu trúc cây tiêu đề và hỗ trợ kéo thả sắp xếp lại vị trí các phần." },
        { topic: "Quản lý đối tượng", q: "Khi nhiều hình khối (Shapes) bị xếp chồng lên nhau khiến bạn không thể nhấp chuột chọn được hình nằm dưới cùng, ngoài Selection Pane, bạn có thể nhấn phím nào sau khi chọn một hình bất kỳ để nhảy lần lượt qua từng đối tượng?", opts: ["Phím Tab", "Phím Ctrl", "Phím Alt", "Phím Spacebar"], ans: 0, exp: "Sau khi chọn một đối tượng đồ họa, nhấn phím Tab (hoặc Shift + Tab) sẽ tuần tự chọn các đối tượng tiếp theo trên trang." },
        { topic: "Trộn thư (Mail Merge)", q: "Trong Mail Merge, khi dữ liệu ngày sinh hoặc số tiền lấy từ tệp Excel sang Word bị mất định dạng (ví dụ: 15000000 thay vì 15,000,000), bạn cần thêm mã chuyển đổi (Field Switch) nào vào bên trong trường trộn (nhấn Alt + F9)?", opts: ["\\# \"#,##0\"", "\\@ \"dd/MM/yyyy\"", "\\* Upper", "\\b \"VNĐ\""], ans: 0, exp: "Switch \\# định dạng số (numeric picture switch); Switch \\@ định dạng ngày tháng." },

      function shuffleQuestionOptions(q) {
        const rightText = q["option" + q.correct];
        const rawOpts = [q.optionA, q.optionB, q.optionC, q.optionD];
        const shuffled = fisherYatesShuffle(rawOpts);
        const newCorrectIdx = shuffled.indexOf(rightText);
        return Object.assign({}, q, {
          optionA: shuffled[0],
          optionB: shuffled[1],
          optionC: shuffled[2],
          optionD: shuffled[3],
          correct: LETTERS[newCorrectIdx >= 0 ? newCorrectIdx : 0]
        });
      }

      // Xuất Excel (có fallback CSV UTF-8 BOM nếu offline)
      function exportToExcel(sheets, filename) {
        if (window.XLSX) {
          const wb = XLSX.utils.book_new();
          sheets.forEach(sheet => {
            const ws = XLSX.utils.aoa_to_sheet(sheet.data);
            XLSX.utils.book_append_sheet(wb, ws, sheet.name);
          });
          XLSX.writeFile(wb, filename);
        } else {
          const csvRows = sheets[0].data.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(","));
          const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename.replace(".xlsx", ".csv");
          a.click();
        }
      }

                    h("div", { className: "mt-4 font-display text-[52px] md:text-[64px] font-[800] leading-[0.9] " + (latestResult.isPassed ? "text-[#0a7d2e]" : "text-[#ff4d2e]") },

                    ),

                    ),
                    h("div", { className: "mt-6 grid md:grid-cols-2 gap-3 max-w-[460px] mx-auto" },

                      examQuestions.map((q, idx) => {
                        const chosen = latestResult.answers[q.id_cauhoi] || "";
                        const isCorrect = chosen === q.correct;
                        return h("div", { key: q.id_cauhoi, className: "border border-black rounded-[16px] p-4 " + (isCorrect ? "bg-[#f4fff4]" : "bg-[#fff6f5]") },

                            h("span", null, "Câu " + (idx + 1) + " • ", h("span", { className: "px-2 py-0.5 bg-white border border-black rounded-full" }, q.chuDe)),
                            h("span", { className: isCorrect ? "text-[#0a7d2e]" : "text-[#ff4d2e]" }, isCorrect ? "✓ ĐÚNG" : "✕ SAI (Chọn: " + (chosen || "Bỏ trống") + " | Đúng: " + q.correct + ")")

                          h("div", { className: "mt-2 font-[600] text-[14px]" }, q.noidung),
                          h("div", { className: "mt-2 grid md:grid-cols-2 gap-1.5 text-[13px]" },
                            ["A", "B", "C", "D"].map(opt => {
                              const isRightOpt = q.correct === opt;
                              const isChosenWrong = chosen === opt && !isRightOpt;
                              let cls = "bg-white border-black/15";
                              if (isRightOpt) cls = "bg-[#d1ffd1] border-black font-[700]";
                              else if (isChosenWrong) cls = "bg-[#ffd6d1] border-[#ff4d2e]";
                              return h("div", { key: opt, className: "px-3 py-1.5 rounded-[8px] border " + cls },

                              );
                            })
                          ),
                          h("div", { className: "mt-2.5 text-[12px] bg-white border-l-4 border-black px-3 py-2 rounded-r-[8px] text-[#333]" },

                      })
                    )
                  )
                )
              )
            ) : (

                      h("div", { className: "text-[11px] text-[#6b6b6b]" }, "Đáp án gốc chia đều A/B/C/D")

                      h("div", { className: "text-[11px] uppercase font-[700] text-[#6b6b6b]" }, "Điểm TB MOS"),

                      h("div", { className: "text-[11px] text-[#6b6b6b]" }, "Xuất Excel 4 sheet")
                    )
                  ),
                  h("div", { className: "bg-white border border-black rounded-[20px] p-5 card-shadow-sm" },

                    ketqua.length === 0 ? h("div", { className: "text-[13px] text-[#6b6b6b] py-6 text-center border border-dashed border-black/30 rounded-[12px]" },

                    ) : h("div", { className: "overflow-auto border border-black rounded-[12px]" },

                            h("th", { className: "p-2.5" }, "Họ tên"),
                            h("th", { className: "p-2.5" }, "Mã đề"),
                            h("th", { className: "p-2.5" }, "Ca thi"),
                            h("th", { className: "p-2.5" }, "Đúng"),
                            h("th", { className: "p-2.5" }, "Điểm MOS"),
                            h("th", { className: "p-2.5" }, "Thang 10"),

                            h("td", { className: "p-2.5 font-[700]" }, k.diem10),
                            h("td", { className: "p-2.5" }, k.xepLoai)

                  h("div", { className: "flex flex-wrap gap-2 mb-4" },
                    h("select", {

                      onChange: e => { setFilterMon(e.target.value); setFilterChuong("all"); },
                      className: "h-9 border border-black rounded-[10px] px-3 text-[13px] font-[600]"

                      h("option", { value: "all" }, "Tất cả môn (200 câu)"),

                      h("option", { value: "MOS_EXCEL" }, "MOS Excel (100 câu)")

                          h("th", { className: "p-2.5" }, "Chủ đề"),

                          h("th", { className: "p-2.5" }, "Đáp án gốc")

                      ),
                      h("tbody", null,
                        filteredCauhoi.map(q => h("tr", { key: q.id_cauhoi, className: "border-t border-black/15 hover:bg-[#f8f8f8]" },

                adminTab === "dethi" && h("div", { className: "space-y-4" },
                  h("div", { className: "bg-white border border-black rounded-[20px] p-5 card-shadow-sm" },

                    h("div", { className: "grid md:grid-cols-2 gap-4" },
                      h("label", { className: "flex items-center justify-between p-4 border border-black rounded-[14px] bg-[#f8f8f8] cursor-pointer" },
                        h("div", null,
                          h("div", { className: "font-[700] text-[14px]" }, "Trộn ngẫu nhiên thứ tự 50 câu hỏi"),
                          h("div", { className: "text-[12px] text-[#6b6b6b]" }, "Mỗi thí sinh nhận thứ tự câu 1..50 hoàn toàn khác nhau")

                        h("input", {
                          type: "checkbox",
                          checked: shuffleConfig.shuffleQuestions,
                          onChange: e => setShuffleConfig(prev => ({ ...prev, shuffleQuestions: e.target.checked })),
                          className: "w-5 h-5 accent-black"
                        })
                      ),
                      h("label", { className: "flex items-center justify-between p-4 border border-black rounded-[14px] bg-[#f8f8f8] cursor-pointer" },
                        h("div", null,
                          h("div", { className: "font-[700] text-[14px]" }, "Trộn ngẫu nhiên 4 phương án trả lời (A, B, C, D)"),
                          h("div", { className: "text-[12px] text-[#6b6b6b]" }, "Đảo vị trí đáp án đúng ngẫu nhiên trên từng câu hỏi")
                        ),
                        h("input", {
                          type: "checkbox",

                          onChange: e => setShuffleConfig(prev => ({ ...prev, shuffleOptions: e.target.checked })),

                        })
                      )

                  h("div", { className: "grid md:grid-cols-2 gap-4" },

                      h("div", { className: "mt-1 text-[12px] font-mono text-[#6b6b6b]" }, "Mã ca: " + ca.id_cathi + " • Đề: " + ca.id_dethi + " • Phòng: " + ca.id_phongthi + " • Mật khẩu: " + ca.matKhauCaThi),
                      h("div", { className: "mt-2 text-[13px]" }, "Thời gian: ", h("strong", null, ca.thoigian_batdau + " - " + ca.thoigian_ketthuc), " (" + ca.ngayThi + ") • Số câu: ", h("strong", null, "50 câu / 40 phút"))
                    ))
                  )
                ),

                adminTab === "users" && h("div", { className: "bg-white border border-black rounded-[20px] p-5 card-shadow-sm" },
                  h("div", { className: "overflow-auto border border-black rounded-[12px]" },
                    h("table", { className: "w-full text-[13px] text-left" },
                      h("thead", { className: "bg-black text-white" },
                        h("tr", null,
                          h("th", { className: "p-2.5" }, "Mã SV"),
                          h("th", { className: "p-2.5" }, "Họ tên"),
                          h("th", { className: "p-2.5" }, "Lớp"),
                          h("th", { className: "p-2.5" }, "Mật khẩu"),
                          h("th", { className: "p-2.5" }, "Vai trò")

                      ),
                      h("tbody", null,
                        users.map(u => h("tr", { key: u.id_user, className: "border-t border-black/15" },
                          h("td", { className: "p-2.5 font-mono font-[700]" }, u.mssv),

                )
              )
            )
          )
        );
      }

      window.__APP_MOUNTED__ = true;
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(h(TestOnlineApp));
    };
  </script>
